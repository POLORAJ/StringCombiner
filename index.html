<!DOCTYPE html>
<html>
<head>
    <title>String Combiner</title>
</head>

<body>

    <h1>Alternate String Combiner</h1>

    <input type="text" id="string1" placeholder="Enter first string">

    <br><br>

    <input type="text" id="string2" placeholder="Enter second string">

    <br><br>

    <button onclick="combineStrings()">Combine</button>

    <p id="result"></p>


    <script>

        function combineStrings() {

            let str1 = document.getElementById("string1").value;
            let str2 = document.getElementById("string2").value;

            let result = "";

            let maxLength = Math.max(str1.length, str2.length);

            for (let i = 0; i < maxLength; i++) {

                if (i < str1.length) {
                    result += str1[i];
                }

                if (i < str2.length) {
                    result += str2[i];
                }

            }

            document.getElementById("result").innerHTML =
                "Combined String: " + result;

        }

    </script>

</body>
</html>
